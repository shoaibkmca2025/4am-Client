<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-site-verification" content="aXj2fD-1BBe7MPoguRkK_NU84RU-S7CjmROUaUdpBbY" />
  <meta name="description"
    content="4AM Global Media provides digital marketing and software development services including web and mobile app solutions to help businesses grow online." />
  <meta name="robots" content="index,follow,max-image-preview:large" />
  <meta name="theme-color" content="#000000" />
  <link rel="canonical" href="https://4amglobalmedia.com/" />
  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://4amglobalmedia.com/" />
  <meta property="og:title" content="A Creative Network made for today &amp; tomorrow | 4AM Global Media" />
  <meta property="og:description" content="4AM Global Media provides digital marketing and software development services including web and mobile app solutions to help businesses grow online." />
  <meta property="og:image" content="https://4amglobalmedia.com/assets/logo-4am.png" />
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="A Creative Network made for today &amp; tomorrow | 4AM Global Media" />
  <meta name="twitter:description" content="4AM Global Media provides digital marketing and software development services including web and mobile app solutions to help businesses grow online." />
  <meta name="twitter:image" content="https://4amglobalmedia.com/assets/logo-4am.png" />
  <title>A Creative Network made for today &amp; tomorrow | 4AM Global Media</title>
  <!-- Favicon & Brand Assets -->
  <link rel="icon" type="image/png" href="/favicon-4am-small.png">
  <link rel="shortcut icon" type="image/png" href="/favicon-4am-small.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon-4am.png">

  <!-- Structured Data for Brand Logo -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "4AM Global Media",
      "url": "https://4amglobalmedia.com",
      "logo": "https://4amglobalmedia.com/assets/logo-4am.png",
      "email": "Info@4amglobalmedia.com",
      "description": "A creative network made for today and tomorrow. Powering founders, operators, and teams across the globe."
    }
    </script>
  <!-- Premium Font Loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Case-study images: resolve DNS early (3D scene is self-hosted) -->
  <link rel="dns-prefetch" href="https://picsum.photos">
  <!-- Non-blocking font load: first paint (boot splash) never waits on
       Google Fonts; text swaps from the system fallback when ready. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"
      rel="stylesheet">
  </noscript>
  <style>
    html {
      background-color: #000000;
    }

    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* ── Instant splash ──────────────────────────────────────────────
       Pure HTML/CSS branded loader painted BEFORE the JS bundle loads,
       so phones never see a black void while React boots. It lives
       inside #root, so React's first render clears it automatically. */
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      background: #000;
      z-index: 2147483647;
      transition: opacity 0.4s ease;
    }
    #boot-splash.bs-hide {
      opacity: 0;
      pointer-events: none;
    }
    #boot-splash .bs-mark {
      display: block;
      width: min(56vw, 250px);
      height: auto;
      animation: bs-pulse 1.15s ease-in-out infinite;
    }
    #boot-splash .bs-bar {
      width: 128px;
      height: 2px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    #boot-splash .bs-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #FF6A3D, #FFC56A);
      animation: bs-slide 1.05s ease-in-out infinite;
    }
    @keyframes bs-pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @keyframes bs-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(320%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash .bs-mark { animation: none; opacity: 1; }
      #boot-splash .bs-bar::after { animation: none; }
    }
  </style>
</head>

<body
  class="bg-black text-white selection:bg-white/20 selection:text-white font-sans leading-relaxed">
  <div id="root"></div>
  <!-- Instant branded splash: overlays #root until React has painted its
       first frame, then app.tsx fades + removes it (no black flash). -->
  <div id="boot-splash" aria-hidden="true">
    <img class="bs-mark" src="/assets/logo-4am-load.png" alt="" width="253" height="143">
    <div class="bs-bar"></div>
  </div>
  <script>
    // Failsafe: never let the splash trap the page if the bundle fails.
    window.setTimeout(function () {
      var s = document.getElementById('boot-splash');
      if (s) { s.classList.add('bs-hide'); setTimeout(function () { s.remove(); }, 450); }
    }, 6000);
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
