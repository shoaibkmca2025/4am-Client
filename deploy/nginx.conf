# nginx reverse proxy for 4AM Global Media
# ─────────────────────────────────────────────────────────────────────
# Put this at /etc/nginx/sites-available/4amglobalmedia.com and symlink it
# into sites-enabled. It forwards all traffic to the Node server on
# 127.0.0.1:8080 and terminates TLS. Certbot fills in the SSL lines.
#
#   sudo ln -s /etc/nginx/sites-available/4amglobalmedia.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d 4amglobalmedia.com -d www.4amglobalmedia.com

# HTTP → HTTPS redirect (certbot also manages this once TLS is set up).
server {
    listen 80;
    listen [::]:80;
    server_name 4amglobalmedia.com www.4amglobalmedia.com;

    # Let certbot serve its ACME challenge, redirect everything else.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 4amglobalmedia.com www.4amglobalmedia.com;

    # ── TLS (certbot fills these in automatically) ──
    # ssl_certificate     /etc/letsencrypt/live/4amglobalmedia.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/4amglobalmedia.com/privkey.pem;

    # Redirect www → apex (optional; drop if you prefer www).
    if ($host = www.4amglobalmedia.com) { return 301 https://4amglobalmedia.com$request_uri; }

    client_max_body_size 8m;        # room for résumé/certificate uploads
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
